<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation - À l'Orée de la Forêt</title>

<script src="maintenance.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261004">
<link rel="manifest" href="/reservation-test/manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="config.js"></script>
<script src="script.js?v=20261004" defer></script>
</head>

<body>
<div class="form-container">

<div class="header-images">
  <img src="logoCarre.png" alt="Logo" class="logo" />

  <h1>
    À l’Orée de la Forêt<br>
    <span class="subtitle-script">Pension canine familiale - Cheillé</span>
    <span class="subtitle-script">Demande de réservation</span>
  </h1>

  <img src="reservationVacances.jpg" alt="Reservation" class="second-image" />
</div>
  <div id="encartFermeture"></div>

  <!-- Étape 1 : saisie de l'e-mail -->
  <div id="etapeEmail">
    <p class="aide-auth">Pour réserver, saisissez l'adresse e-mail de votre fiche client : nous vous enverrons un code de connexion.</p>
    <label for="emailAuth">Email</label>
    <input type="email" id="emailAuth" autocomplete="email" inputmode="email" />
    <button type="button" id="btnEnvoyerCode">Recevoir un code</button>
  </div>

  <!-- Étape 2 : saisie du code reçu -->
  <div id="etapeCode" hidden>
    <p class="aide-auth">Un code vous a été envoyé par e-mail. Saisissez-le ci-dessous.</p>
    <label for="codeOtp">Code de connexion</label>
    <input type="text" id="codeOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" />
    <button type="button" id="btnValiderCode">Valider</button>
    <button type="button" id="btnRenvoyer" class="btn-lien">Renvoyer le code</button><br>
    <button type="button" id="btnChangerEmail" class="btn-lien">Changer d'e-mail</button>
  </div>

  <!-- Étape 3 : formulaire de réservation (affiché une fois connecté) -->
  <form id="reservationForm" hidden>
    <div class="session-bar">
      <span>Connecté : <strong id="emailSession"></strong></span>
      <button type="button" id="btnDeconnexion" class="btn-lien" style="margin-top:0">Se déconnecter</button>
    </div>

    <label>Nom et prénom du propriétaire</label>
    <input type="text" name="nom_proprietaire" required />

    <label>Email</label>
    <input type="email" name="email" required readonly />

    <label>Chien(s) à garder</label>
    <div id="nomsChiensContainer"></div>

    <div class="datetime-group">
      <label>Arrivée</label>
      <div class="datetime-fields">
        <input type="date" id="dateArrivee" name="date_arrivee" required />
        <select id="heureArrivee" name="heure_arrivee" required></select>
      </div>
    </div>

    <div class="datetime-group">
      <label>Départ</label>
      <div class="datetime-fields">
        <input type="date" id="dateDepart" name="date_depart" required />
        <select id="heureDepart" name="heure_depart" required></select>
      </div>
    </div>

    <label>Remarque</label>
    <textarea name="remarque"></textarea>

    <button type="submit">Envoyer la réservation</button>
  </form>

  <div id="message"></div>
</div>

</body>
</html>
