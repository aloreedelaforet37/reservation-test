<!DOCTYPE html>
<html lang="fr">
<script src="maintenance.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation - À l'Orée de la Forêt</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="/reservation-test/manifest.json">
<link rel="stylesheet" href="style.css?v=20261001">
<script src="config.js?v=20261003"></script>
<script src="script.js?v=20261001"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
  /* Champs texte créés par updateNomChiens() (remplacés par les cases à cocher après connexion) */
  #nomsChiensContainer { margin-bottom: 20px; }
  .chien-field { display: flex; flex-direction: column; margin-bottom: 10px; }
</style>
</head>

<body>
<div class="form-container">

<div class="header-images">
  <img src="logoCarre.png" alt="Logo" class="logo" />

  <h1>
    À l’Orée de la Forêt<br>
    <span class="subtitle-script">Pension canine familiale - Cheillé</span>
    <span class="subtitle-script">Demande de réservation</span>
  </h1>

  <img src="reservationVacances.jpg" alt="Reservation" class="second-image" />
</div>
  <div id="encartFermeture"></div>

  <!-- ÉTAPE 1 : saisie de l'e-mail -->
  <div id="etapeEmail" hidden>
    <p class="aide-auth">Pour réserver, saisissez votre adresse e-mail : nous vous envoyons un code de connexion.</p>
    <label for="emailAuth">Votre adresse e-mail</label>
    <input type="email" id="emailAuth" autocomplete="email" placeholder="prenom.nom@exemple.fr" />
    <button type="button" id="btnEnvoyerCode">Recevoir un code</button>
  </div>

  <!-- ÉTAPE 2 : saisie du code OTP -->
  <div id="etapeCode" hidden>
    <p class="aide-auth">Un code vient de vous être envoyé par e-mail (pensez à vérifier vos courriers indésirables).</p>
    <label for="codeOtp">Code de connexion</label>
    <input type="text" id="codeOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" />
    <button type="button" id="btnValiderCode">Valider le code</button>
    <button type="button" class="btn-lien" id="btnRenvoyer">Renvoyer le code</button>
    <button type="button" class="btn-lien" id="btnChangerEmail">Changer d'adresse e-mail</button>
  </div>

  <!-- ÉTAPE 3 : formulaire (affiché après authentification) -->
  <form id="reservationForm" hidden>
    <div class="session-bar">
      <span>Connecté : <span id="emailSession"></span></span>
      <button type="button" class="btn-lien" id="btnDeconnexion">Se déconnecter</button>
    </div>

    <label>Nom et prénom du propriétaire</label>
    <input type="text" name="nom_proprietaire" required />

    <label>Email</label>
    <input type="email" name="email" readonly required />

    <label>Chien(s) concerné(s)</label>
    <!-- nb_chien est requis par script.js (champ technique) -->
    <input type="hidden" name="nb_chien" value="1" />
    <div id="nomsChiensContainer"></div>

    <div class="datetime-group">
      <label>Arrivée</label>
      <div class="datetime-fields">
        <input type="date" id="dateArrivee" name="date_arrivee" required />
        <select id="heureArrivee" name="heure_arrivee" required></select>
      </div>
    </div>

    <div class="datetime-group">
      <label>Départ</label>
      <div class="datetime-fields">
        <input type="date" id="dateDepart" name="date_depart" required />
        <select id="heureDepart" name="heure_depart" required></select>
      </div>
    </div>

    <label>Remarque</label>
    <textarea name="remarque"></textarea>

    <button type="submit">Envoyer la réservation</button>
  </form>

  <div id="message"></div>
</div>

</body>
</html>
